[env:heltec-ht62-esp32c3-sx1262]
custom_meshtastic_hw_model = 53
custom_meshtastic_hw_model_slug = HELTEC_HT62
custom_meshtastic_architecture = esp32-c3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Heltec HT62
custom_meshtastic_images = heltec-ht62-esp32c3-sx1262.svg
custom_meshtastic_tags = Heltec

extends = esp32c3_base
board = esp32-c3-devkitm-1
board_level = pr
build_flags = 
  ${esp32c3_base.build_flags}
  -D HELTEC_HT62
  -I variants/esp32c3/heltec_esp32c3
monitor_speed = 115200
upload_protocol = esptool
;upload_port = /dev/ttyUSB0
upload_speed = 921600

; ── Siliqs SQC485Iv2 (ESP32-C3 + SX1262, RS485 industrial node) ───────────────
; Ships the Taiwan DTS-certified radio profile as the factory default
; (922.5 MHz / BW500 / SF9 / CR4:5, region TW -> tx_power auto = 22 dBm).
; See src/mesh/Channels.cpp initDefaultLoraConfig() — that is the LoRa-config
; authority; NodeDB::installDefaultConfig() carries the same values.
[env:sqc485iv2-esp32c3-sx1262]
custom_meshtastic_hw_model = 53
custom_meshtastic_hw_model_slug = HELTEC_HT62
custom_meshtastic_architecture = esp32-c3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 0
custom_meshtastic_display_name = SQC485Iv2 (ESP32-C3 + SX1262)
custom_meshtastic_tags = SQC485Iv2, Solar

extends = esp32c3_base
board = esp32-c3-devkitm-1
board_level = pr
build_flags =
  ${esp32c3_base.build_flags}
  -D SQC485IV2
  -I variants/esp32c3/sqc485iv2
  -I src/siliqs/firmware_core/include
  -D REGULATORY_LORA_REGIONCODE=meshtastic_Config_LoRaConfig_RegionCode_TW
  ; HT-CT62 has native USB — route the console to USB CDC (visible over the USB port)
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; Product is certified for Taiwan — default the node region so it transmits out-of-box
  -D USERPREFS_CONFIG_LORA_REGION=meshtastic_Config_LoRaConfig_RegionCode_TW
monitor_speed = 115200
upload_protocol = esptool
; native USB: the default 921600 baud-change step fails, keep it low
upload_speed = 115200

; Board rev v231: single inverter U6 inverts only GPIO2 -> #RE; RS485 DE is driven
; DIRECTLY from GPIO9 (R15 0Ohm, non-inverted). v233 added a dual inverter (U7) that
; also inverts GPIO9 -> DE. So v231 needs DE polarity NON-inverted (HIGH = transmit)
; — the only firmware-visible difference between the two boards.
[env:sqc485iv2-v231-esp32c3-sx1262]
extends = env:sqc485iv2-esp32c3-sx1262
custom_meshtastic_display_name = SQC485Iv2 rev v231 (ESP32-C3 + SX1262)
build_flags =
  ${env:sqc485iv2-esp32c3-sx1262.build_flags}
  ; v231: GPIO9 drives DE directly (no inverter) — transmit = GPIO9 HIGH
  -D SQC485I_DE_INVERTED=0

; ── USB↔RS485 data tunnel build ──────────────────────────────────────────────
; A dedicated SKU: the Meshtastic console is moved OFF the USB CDC (routed to a
; NullStream via USER_DEBUG_PORT) so the USB port is a raw serial data source. Two
; such nodes form a transparent USB<->USB serial pipe over LoRa: each reads its USB,
; idle-gap frames it, and pushes 'SQ~' to its peer, which writes it to ITS USB
; (symmetric, no RS485). Provision over BLE only (no USB console on this build).
; ESP32-only (nRF54L15 has no USB).
[env:sqc485iv2-usbtunnel-esp32c3-sx1262]
extends = env:sqc485iv2-esp32c3-sx1262
build_flags =
  ${env:sqc485iv2-esp32c3-sx1262.build_flags}
  -D SQ_USB_TUNNEL
  -D USER_DEBUG_PORT=g_nullStream
  -include src/siliqs/NullStream.h
