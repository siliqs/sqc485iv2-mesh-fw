; ── Siliqs SQS-TH-I (ESP32-C3 + SX1262, built-in HDC1080 temp/humidity node) ──
; First product of the SQS-Sensor line — same platform as SQC485Iv2 with the RS485
; front-end removed and a built-in HDC1080 sensor on I2C (GPIO20/21).
;
; Ships the Taiwan DTS-certified radio profile as the factory default
; (922.5 MHz / BW500 / SF9 / CR4:5, region TW -> tx_power auto = 22 dBm), shared
; with SQC485Iv2. The LoRa-config authority is src/mesh/Channels.cpp
; initDefaultLoraConfig(); NodeDB::installDefaultConfig() carries the same values.
; Both key off `SQS_TH_I` (added alongside SQC485IV2 in those #ifdefs).
;
; The `-D SQC485IV2` app (ModbusModule) is intentionally NOT defined here, so no
; RS485/Modbus module is registered. The HDC1080 sensor module is added under
; `#ifdef SQS_TH_I` (see src/modules/Modules.cpp).
[env:sqs-th-i-esp32c3-sx1262]
custom_meshtastic_hw_model = 53
custom_meshtastic_hw_model_slug = HELTEC_HT62
custom_meshtastic_architecture = esp32-c3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 0
custom_meshtastic_display_name = SQS-TH-I (ESP32-C3 + SX1262)
custom_meshtastic_tags = SQS-TH-I, SQS-Sensor

extends = esp32c3_base
board = esp32-c3-devkitm-1
board_level = pr
build_flags =
  ${esp32c3_base.build_flags}
  -D SQS_TH_I
  -I variants/esp32c3/sqs-th-i
  -I src/siliqs/firmware_core/include
  -D REGULATORY_LORA_REGIONCODE=meshtastic_Config_LoRaConfig_RegionCode_TW
  ; HT-CT62 has native USB — route the console to USB CDC (visible over the USB port)
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; Product is certified for Taiwan — default the node region so it transmits out-of-box
  -D USERPREFS_CONFIG_LORA_REGION=meshtastic_Config_LoRaConfig_RegionCode_TW
monitor_speed = 115200
upload_protocol = esptool
; native USB: the default 921600 baud-change step fails, keep it low
upload_speed = 115200
