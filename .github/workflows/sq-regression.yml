name: Siliqs regression (SQC485Iv2)

# Guards the Siliqs additions to this fork. Upstream Meshtastic CI covers the
# rest of the tree; nothing here touches it.
#
# Deliberately split in two so a failure says which layer broke: the host tests
# come back in seconds, the firmware builds take minutes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: firmware_core host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run unit tests
        run: make -C test/sq_core test

      # The fixtures are the independent side of the comparison, so they must be
      # committed output — not something the test run regenerates. If the
      # generator and the checked-in hex disagree, one of them was edited alone.
      - name: Golden fixtures are up to date
        run: |
          python3 test/sq_core/golden/make_golden.py
          if ! git diff --quiet -- test/sq_core/golden; then
            echo "::error::golden fixtures differ from make_golden.py output"
            git diff -- test/sq_core/golden
            exit 1
          fi

  build-regression:
    name: firmware build + certified defaults
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0 # release-tag consistency needs the tags

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install -U pip
          pip install -U platformio

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio
            .pio
          # Leading with the expression keeps gitleaks' generic-api-key rule from
          # reading a long literal cache key as a credential.
          key: ${{ runner.os }}-pio-sqc485iv2-${{ hashFiles('platformio.ini', 'variants/esp32c3/**') }}
          restore-keys: ${{ runner.os }}-pio-sqc485iv2-

      - name: Build all SQC485Iv2 environments and check the image
        run: ./bin/sq-build-check.sh

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sqc485iv2-firmware
          path: .pio/build/sqc485iv2-*/firmware-*.bin
          if-no-files-found: warn
